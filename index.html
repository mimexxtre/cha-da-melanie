<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chá da Melanie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 241, 118, 0.8), transparent 28%),
        radial-gradient(circle at 80% 18%, rgba(255, 209, 220, 0.8), transparent 30%),
        linear-gradient(180deg, #fffaf1 0%, #fff4c2 45%, #ffe4ef 100%);
      color: #7a5600;
      padding: 24px;
    }

    .box {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid rgba(255, 205, 80, 0.45);
      border-radius: 32px;
      padding: 42px 24px;
      box-shadow: 0 20px 50px rgba(150, 115, 31, 0.16);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 26px;
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1.2;
      color: #8f5f00;
    }

    .bee {
      width: min(240px, 70vw);
      height: auto;
      animation: floatBee 3s ease-in-out infinite;
      filter: drop-shadow(0 16px 28px rgba(165, 120, 18, 0.22));
    }

    @keyframes floatBee {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-12px) rotate(2deg);
      }
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>O chá já aconteceu, obrigado! 😊</h1>
    <img src="abelha.png" alt="Abelhinha" class="bee" />
  </main>
</body>
</html>
